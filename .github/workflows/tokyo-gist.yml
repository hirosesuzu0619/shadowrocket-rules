# 把 configs/tokyo.js 填上美国订阅链接，写进一个私密 Gist，供 Clash Mi 按链接加载覆写并自动更新。
# 订阅链接、Gist 编号与令牌都放在仓库的 Secrets 里；这个仓库是公开的，Actions 日志人人可见，所以任何一步都不打印它们。
# 需要三个 Secret：US_SUBSCRIPTION（美国订阅链接）、GIST_ID（私密 Gist 的编号）、GIST_TOKEN（只有 gist 权限的令牌）。
name: Publish Tokyo override to Gist

on:
  push:
    branches:
      - claude/rules-grouping-proxy-setup-ffszj4
    paths:
      - configs/tokyo.js
      - .github/workflows/tokyo-gist.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill in the US subscription
        env:
          US_SUBSCRIPTION: ${{ secrets.US_SUBSCRIPTION }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          url = os.environ.get("US_SUBSCRIPTION", "").strip()
          if not url:
              sys.exit("缺少 Secret：US_SUBSCRIPTION")
          src = pathlib.Path("configs/tokyo.js").read_text(encoding="utf-8")
          line = 'var US_SUBSCRIPTION = "";'
          if src.count(line) != 1:
              sys.exit("configs/tokyo.js 里找不到 US_SUBSCRIPTION 那一行")
          pathlib.Path("tokyo-us.js").write_text(src.replace(line, f"var US_SUBSCRIPTION = {json.dumps(url)};"), encoding="utf-8")
          PY

      - name: Update the Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_ID" ] || [ -z "$GIST_TOKEN" ]; then
            echo "缺少 Secret：GIST_ID 或 GIST_TOKEN" >&2
            exit 1
          fi
          jq -n --rawfile content tokyo-us.js '{files: {"tokyo-us.js": {content: $content}}}' > payload.json
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data @payload.json \
            "https://api.github.com/gists/$GIST_ID")
          if [ "$status" != "200" ]; then
            echo "更新 Gist 失败，HTTP $status（401 多半是令牌失效，404 多半是 Gist 编号不对或令牌没有 gist 权限）" >&2
            exit 1
          fi
          echo "Gist 已更新"
