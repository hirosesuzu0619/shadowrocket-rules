# Telegram 走专用的 TELEGRAM 组，见上方策略组说明
DOMAIN-KEYWORD,telegram,TELEGRAM
DOMAIN-SUFFIX,t.me,TELEGRAM
DOMAIN-SUFFIX,telegra.ph,TELEGRAM
DOMAIN-SUFFIX,telesco.pe,TELEGRAM
# 客户端直接连这些 IP 段，按官方公布的 cidr.txt 补齐了 91.108.20.0/22、91.105.192.0/23、185.76.151.0/24 等此前缺的段
IP-CIDR,91.108.4.0/22,TELEGRAM,no-resolve
IP-CIDR,91.108.8.0/21,TELEGRAM,no-resolve
IP-CIDR,91.108.12.0/22,TELEGRAM,no-resolve
IP-CIDR,91.108.16.0/22,TELEGRAM,no-resolve
IP-CIDR,91.108.20.0/22,TELEGRAM,no-resolve
IP-CIDR,91.108.56.0/22,TELEGRAM,no-resolve
IP-CIDR,91.105.192.0/23,TELEGRAM,no-resolve
IP-CIDR,149.154.160.0/20,TELEGRAM,no-resolve
IP-CIDR,185.76.151.0/24,TELEGRAM,no-resolve
IP-CIDR6,2001:67c:4e8::/48,TELEGRAM,no-resolve
IP-CIDR6,2001:b28:f23c::/48,TELEGRAM,no-resolve
IP-CIDR6,2001:b28:f23d::/48,TELEGRAM,no-resolve
IP-CIDR6,2001:b28:f23f::/48,TELEGRAM,no-resolve
IP-CIDR6,2a0a:f280::/32,TELEGRAM,no-resolve
# 被墙域名按域名直接走代理：名单由 Loyalsoldier 从 v2fly 的 gfw 分类生成，与 Nextin Hub 模板用的是同一份来源
# 不放这一条时，这些域名要先经国内 DoH 解析、再由 GEOIP 判断，解析慢或超时，连接就跟着等；名单不含 apple.com、microsoft.com 等国内也在用的域名
DOMAIN-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/gfw.txt,OVERSEAS
# 以上都没命中时按解析出的 IP 判断，落在国内的直连
GEOIP,CN,DIRECT
# 其余走 OVERSEAS 自动组
FINAL,OVERSEAS
