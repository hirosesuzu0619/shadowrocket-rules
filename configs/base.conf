DOMAIN-KEYWORD,pinterest,EAST_ASIA
DOMAIN-KEYWORD,discord,EAST_ASIA
DOMAIN-KEYWORD,netflix,EAST_ASIA
DOMAIN-KEYWORD,spotify,EAST_ASIA
