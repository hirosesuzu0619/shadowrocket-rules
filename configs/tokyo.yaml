x-nextin:
  version: 1
  mode: subscription-template
  name: "追踪器、AI 平台合集、OpenAI、Anthropic、Google Gemini"
  builder: "{\"schemaVersion\":1,\"catalogVersion\":\"routing-1-1dee4937\",\"ruleIDs\":[\"private-domain\",\"private-ip\",\"ads\",\"tracker\",\"openai\",\"anthropic\",\"gemini\",\"ai-all\",\"cn-ip\",\"gfw\"],\"defaultPolicy\":{\"includePattern\":\".*\",\"excludeRegions\":[\"hk\",\"sg\",\"tw\"],\"excludePattern\":\"\",\"groupType\":\"url-test\"},\"ruleOverrides\":{\"ai-all\":{\"includePattern\":\"(?i)((?:美国|United States|Los Angeles|Seattle|\\\\bUSA?\\\\b))\",\"excludeRegions\":[],\"excludePattern\":\"\",\"groupType\":\"url-test\"},\"openai\":{\"includePattern\":\"(?i)((?:美国|United States|Los Angeles|Seattle|\\\\bUSA?\\\\b))\",\"excludeRegions\":[\"hk\",\"sg\",\"tw\"],\"excludePattern\":\"\",\"groupType\":\"url-test\"},\"anthropic\":{\"includePattern\":\"(?i)((?:美国|United States|Los Angeles|Seattle|\\\\bUSA?\\\\b))\",\"excludeRegions\":[\"hk\",\"sg\",\"tw\"],\"excludePattern\":\"\",\"groupType\":\"url-test\"},\"gemini\":{\"includePattern\":\"(?i)((?:美国|United States|Los Angeles|Seattle|\\\\bUSA?\\\\b))\",\"excludeRegions\":[\"hk\",\"sg\",\"tw\"],\"excludePattern\":\"\",\"groupType\":\"url-test\"}},\"matchTarget\":\"direct\"}"


proxies: []

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    include-all-proxies: true
    filter: "(日本|东京)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire)"
    proxies:
      - "🛡️ 故障转移"
      - DIRECT
  - name: "🇺🇸 美国"
    type: fallback
    use:
      - us
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
  - name: "🛡️ 故障转移"
    type: fallback
    include-all-proxies: true
    exclude-filter: "(?i)(剩余|流量|套餐|到期|重置|官网|Traffic|Expire)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300

