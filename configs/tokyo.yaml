# 规则的条目与 nextin.yaml 相同，只改指向：AI 服务（模板的 OpenAI、Anthropic、Gemini、AI 平台合集与个人规则的 Meta AI、Claude、Grok）
# 以及希尔顿、Kraken、Kalshi、Equifax、美国金融与运营商、TopCashback、Trip.com 走「🇺🇸 美国」，其余原先指向代理分组的规则一律走「🚀 节点选择」。
